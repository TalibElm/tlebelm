<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الطلاب · لوحة الإدارة</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07050A">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="admin-body" data-admin="students">
  <div class="admin-shell">
    <aside class="admin-side" id="admin-side"></aside>
    <div class="admin-main">
      <header class="admin-top" id="admin-top"></header>
      <div class="admin-content">
        <div class="toolbar">
          <input class="input" id="student-search" type="search" placeholder="ابحث بالاسم أو رقم الهاتف…" style="min-width:260px">
          <span class="tiny muted" id="students-count"></span>
        </div>

        <div class="card">
          <div id="students-loading" class="loading-line" style="padding:20px"><span class="spinner"></span>جارٍ تحميل الطلاب…</div>
          <div id="students-table" class="table-wrap hidden" style="border:0">
            <table class="data">
              <thead>
                <tr><th>الطالب</th><th>الهاتف</th><th>الدورات</th><th>تاريخ الانضمام</th><th>آخر دخول</th><th></th></tr>
              </thead>
              <tbody id="students-body"></tbody>
            </table>
          </div>
          <div id="students-empty" class="hidden">
            <div class="empty"><div class="icon">👥</div>لا يوجد طلاب مطابقون.</div>
          </div>
        </div>

        <div class="pager">
          <button class="btn btn-ghost btn-sm" id="students-prev" disabled>السابق</button>
          <span class="tiny muted" id="students-page">صفحة 1</span>
          <button class="btn btn-ghost btn-sm" id="students-next" disabled>التالي</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/vendor/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/admin-shell.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
