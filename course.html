<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منهج الدورة · لوحة الإدارة</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07050A">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="admin-body" data-admin="course">
  <div class="admin-shell">
    <aside class="admin-side" id="admin-side"></aside>
    <div class="admin-main">
      <header class="admin-top" id="admin-top"></header>
      <div class="admin-content">
        <div class="tiny muted"><a class="muted" href="courses.html">الدورات</a> / منهج الدورة</div>

        <div class="page-head mt-2">
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <h2 class="page-title" id="course-title">جارٍ التحميل…</h2>
              <span id="course-status"></span>
            </div>
            <p class="page-sub" id="course-meta"></p>
          </div>
          <div class="flex gap-2 flex-wrap">
            <a class="btn btn-ghost btn-sm" id="edit-course-btn" href="#">تعديل بيانات الدورة</a>
            <a class="btn btn-ghost btn-sm" id="view-course-btn" href="#" target="_blank" rel="noopener">معاينة</a>
            <button class="btn btn-primary btn-sm" id="add-module-btn">+ وحدة جديدة</button>
          </div>
        </div>

        <div id="curriculum-loading" class="loading-line"><span class="spinner"></span>جارٍ تحميل المنهج…</div>
        <div id="curriculum-empty" class="card hidden">
          <div class="empty">
            <div class="icon">🗂</div>
            لا توجد وحدات بعد. أضف الوحدة الأولى ثم أضف الدروس داخلها.
          </div>
        </div>
        <div id="modules"></div>
      </div>
    </div>
  </div>

  <script src="../assets/vendor/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/admin-shell.js"></script>
  <script src="../assets/js/admin-courses.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
